openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Identificação simples por apelido
  - name: licoes
    description: Trilha de aulas de digitação
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/entrar:
    post:
      operationId: entrar
      tags: [auth]
      summary: Entrar ou cadastrar com apelido e avatar
      description: Cria o jogador ou reconhece o mesmo jogador (apelido + identificação do computador) e inicia a sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntrarInput"
      responses:
        "200":
          description: Jogador reconhecido ou criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jogador"
        "400":
          description: Apelido ou avatar inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "409":
          description: Apelido já está em uso por outro jogador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "429":
          description: Muitas tentativas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /auth/eu:
    get:
      operationId: obterJogadorAtual
      tags: [auth]
      summary: Jogador da sessão atual
      responses:
        "200":
          description: Jogador logado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jogador"
        "401":
          description: Sem sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /auth/sair:
    post:
      operationId: sair
      tags: [auth]
      summary: Encerrar a sessão
      responses:
        "200":
          description: Sessão encerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ranking:
    get:
      operationId: obterRanking
      tags: [ranking]
      summary: Ranking dos jogadores
      parameters:
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [pontos, velocidade]
            default: pontos
      responses:
        "200":
          description: Os 20 primeiros e a posição de quem está jogando
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ranking"
        "401":
          description: Sem sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /perfil:
    get:
      operationId: obterPerfil
      tags: [perfil]
      summary: Perfil, recordes e medalhas do jogador
      responses:
        "200":
          description: Perfil completo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
        "401":
          description: Sem sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /licoes:
    get:
      operationId: listarLicoes
      tags: [licoes]
      summary: Lições com progresso do jogador
      responses:
        "200":
          description: Trilha de lições
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Licao"
        "401":
          description: Sem sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /licoes/{id}/resultado:
    post:
      operationId: enviarResultadoLicao
      tags: [licoes]
      summary: Enviar o resultado de uma lição
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultadoLicaoInput"
      responses:
        "200":
          description: Resultado calculado pelo servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoLicao"
        "400":
          description: Resultado inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "401":
          description: Sem sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "403":
          description: Lição ainda bloqueada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "404":
          description: Lição não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
components:
  schemas:
    Licao:
      type: object
      properties:
        id:
          type: integer
        ordem:
          type: integer
        titulo:
          type: string
        descricao:
          type: string
        textoAlvo:
          type: string
        teclasFoco:
          type: string
        desbloqueada:
          type: boolean
        estrelas:
          type: integer
          description: Melhor resultado, de 0 a 3
        melhorWpm:
          type: number
        melhorPrecisao:
          type: number
        semOlharDisponivel:
          type: boolean
      required:
        - id
        - ordem
        - titulo
        - descricao
        - textoAlvo
        - teclasFoco
        - desbloqueada
        - estrelas
        - melhorWpm
        - melhorPrecisao
        - semOlharDisponivel
    ResultadoLicaoInput:
      type: object
      properties:
        duracaoMs:
          type: integer
          description: Tempo entre o primeiro e o último toque
        erros:
          type: integer
        errosPorTecla:
          type: object
          additionalProperties:
            type: integer
          description: Erros por tecla física (event.code)
        teclasEsquerda:
          type: integer
        teclasDireita:
          type: integer
        semOlhar:
          type: boolean
      required:
        - duracaoMs
        - erros
        - errosPorTecla
        - teclasEsquerda
        - teclasDireita
        - semOlhar
    ResultadoLicao:
      type: object
      properties:
        wpm:
          type: number
        precisao:
          type: number
        estrelas:
          type: integer
        pontosGanhos:
          type: integer
        pontosTotais:
          type: integer
        nivel:
          type: string
        subiuDeNivel:
          type: boolean
        proximaLicaoDesbloqueada:
          type: boolean
        melhorou:
          type: boolean
        esquerdaPct:
          type: integer
        direitaPct:
          type: integer
        desequilibrada:
          type: string
          enum: [esquerda, direita, nenhuma]
        mensagem:
          type: string
        dica:
          type: string
        medalhasNovas:
          type: array
          items:
            $ref: "#/components/schemas/Medalha"
        sequenciaDias:
          type: integer
      required:
        - medalhasNovas
        - sequenciaDias
        - wpm
        - precisao
        - estrelas
        - pontosGanhos
        - pontosTotais
        - nivel
        - subiuDeNivel
        - proximaLicaoDesbloqueada
        - melhorou
        - esquerdaPct
        - direitaPct
        - desequilibrada
        - mensagem
        - dica
    Medalha:
      type: object
      properties:
        chave:
          type: string
        titulo:
          type: string
        descricao:
          type: string
        conquistada:
          type: boolean
        conquistadaEm:
          type: string
          format: date-time
          nullable: true
      required:
        - chave
        - titulo
        - descricao
        - conquistada
        - conquistadaEm
    ItemRanking:
      type: object
      properties:
        posicao:
          type: integer
        jogadorId:
          type: integer
        apelido:
          type: string
        avatar:
          type: string
        nivel:
          type: string
        valor:
          type: number
          description: Pontos ou palavras por minuto, conforme o tipo
      required:
        - posicao
        - jogadorId
        - apelido
        - avatar
        - nivel
        - valor
    Ranking:
      type: object
      properties:
        tipo:
          type: string
          enum: [pontos, velocidade]
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ItemRanking"
        voce:
          allOf:
            - $ref: "#/components/schemas/ItemRanking"
          nullable: true
          description: Posição de quem está jogando (nulo se ainda não tem marca neste ranking)
        totalJogadores:
          type: integer
      required:
        - tipo
        - itens
        - voce
        - totalJogadores
    Perfil:
      type: object
      properties:
        apelido:
          type: string
        avatar:
          type: string
        nivel:
          type: string
        pontosTotais:
          type: integer
        pontosProximoNivel:
          type: integer
          nullable: true
          description: Pontos que faltam para o próximo nível (nulo no último nível)
        proximoNivel:
          type: string
          nullable: true
        sequenciaDias:
          type: integer
        licoesConcluidas:
          type: integer
        totalLicoes:
          type: integer
        estrelasTotais:
          type: integer
        melhorWpm:
          type: number
        melhorPrecisao:
          type: number
        corridasDisputadas:
          type: integer
        vitorias:
          type: integer
        posicaoPontos:
          type: integer
        entrouEm:
          type: string
          format: date-time
        medalhas:
          type: array
          items:
            $ref: "#/components/schemas/Medalha"
      required:
        - apelido
        - avatar
        - nivel
        - pontosTotais
        - pontosProximoNivel
        - proximoNivel
        - sequenciaDias
        - licoesConcluidas
        - totalLicoes
        - estrelasTotais
        - melhorWpm
        - melhorPrecisao
        - corridasDisputadas
        - vitorias
        - posicaoPontos
        - entrouEm
        - medalhas
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Erro:
      type: object
      properties:
        erro:
          type: string
      required:
        - erro
    EntrarInput:
      type: object
      properties:
        apelido:
          type: string
          description: 3 a 16 caracteres, letras e números, sem espaços
        avatar:
          type: string
          description: Chave do avatar (avatar-1 até avatar-12)
      required:
        - apelido
        - avatar
    Jogador:
      type: object
      properties:
        id:
          type: integer
        apelido:
          type: string
        avatar:
          type: string
        pontosTotais:
          type: integer
        nivel:
          type: string
          description: Pintinho, Galinha, Galo ou Mestre do Milharal
        sequenciaDias:
          type: integer
        novo:
          type: boolean
          description: Verdadeiro quando o cadastro acabou de ser criado
      required:
        - id
        - apelido
        - avatar
        - pontosTotais
        - nivel
        - sequenciaDias
        - novo
